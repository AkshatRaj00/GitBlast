version: 2
updates:
  # 1. NPM Dependencies with Grouped Updates, Vulnerability Alerting & Daily Schedule
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
    open-pull-requests-limit: 15
    # Group minor and patch updates together to avoid spamming pull requests
    groups:
      default:
        patterns:
          - "*"
          - "!typescript"
    labels:
      - "dependencies"
      - "security"
      - "automated"
    # Automatically allow security patch updates
    allow:
      - dependency-type: "all"

  # 2. GitHub Actions Workflows Ecosystem Health & Security Check
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "ci-cd"
      - "security"
      - "automated"
