version: 2
updates:
  # Daily version PRs; normal updates and major upgrades stay in separate reviewable PRs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
    open-pull-requests-limit: 15
    groups:
      routine-updates:
        patterns:
          - "*"
          - "!typescript"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"
    labels:
      - "dependencies"
      - "security"
      - "automated"
    allow:
      - dependency-type: "all"

  # Keep third-party workflow actions current through dedicated Dependabot PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "ci-cd"
      - "security"
      - "automated"
