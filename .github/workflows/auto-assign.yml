name: 'Auto Assign'
on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: 'Auto Assign to Author'
        uses: kentaro-m/auto-assign-action@v2.0.2
        with:
          add-assignees: author
          add-reviewers: author
