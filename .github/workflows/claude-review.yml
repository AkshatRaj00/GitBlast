name: Claude pull request review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to fork PRs. Keep fork contributions on the normal CI checks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Explain missing Anthropic API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo 'Add ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions to enable Claude reviews.' >> "$GITHUB_STEP_SUMMARY"
      - name: Review pull request with Claude
        if: env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: --allowedTools "mcp__github_inline_comment__create_inline_comment"
