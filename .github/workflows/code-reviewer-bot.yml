name: Pull request review checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint review (informational while baseline is repaired)
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Production build and TypeScript validation
        id: build
        run: npm run build
      - name: Write check summary
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          echo '### GitBlast automated PR checks' >> "$GITHUB_STEP_SUMMARY"
          echo "- ESLint: **$LINT_OUTCOME** (informational until the existing lint backlog is fixed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production build and TypeScript: **$BUILD_OUTCOME**" >> "$GITHUB_STEP_SUMMARY"
          echo '- These checks report status only; they do not certify security or merge safety.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report actual check results on the pull request
        if: always() && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const marker = '<!-- gitblast-automated-review -->';
            const status = (value) => value === 'success' ? 'passed' : value === 'skipped' ? 'not run' : 'failed';
            const body = [
              marker,
              '### GitBlast automated PR checks',
              `- ESLint: **${status(process.env.LINT_OUTCOME)}** (informational until the existing lint backlog is fixed)`,
              `- Production build and TypeScript: **${status(process.env.BUILD_OUTCOME)}**`,
              '',
              'These checks report build and lint status only; they do not certify security or merge safety.'
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const previous = comments.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
