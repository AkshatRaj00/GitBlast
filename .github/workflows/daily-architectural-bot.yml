name: Daily repository health review

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build and TypeScript check
        id: build
        continue-on-error: true
        run: npm run build
      - name: Run ESLint repository review
        id: lint
        shell: bash
        run: |
          result=0
          npm run lint > lint-report.txt 2>&1 || result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          cat lint-report.txt
      - name: Store ESLint report
        if: steps.lint.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: daily-eslint-report
          path: lint-report.txt
          retention-days: 30
      - name: Open or update code quality issue
        if: steps.lint.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'code-quality', color: 'fbca04', description: 'Automated lint findings to resolve' });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const title = 'ESLint findings need attention';
            const body = `The scheduled ESLint review found issues on ${context.sha}. Download the `daily-eslint-report` artifact from this workflow run for the full output. The PR review workflow reports the same check on changes.`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'code-quality', per_page: 100 });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['code-quality'] });
            }
      - name: Close resolved code quality issue
        if: steps.lint.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'code-quality', per_page: 100 });
            for (const issue of issues.filter((item) => item.title === 'ESLint findings need attention')) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
      - name: Scan production and development dependencies
        id: audit
        shell: bash
        run: |
          npm audit --json > audit-report.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
          const findings = Object.entries(audit.vulnerabilities || {}).filter(([, item]) => ['high', 'critical'].includes(item.severity));
          const summary = findings.slice(0, 20).map(([name, item]) => `${name}: ${item.severity}; fix available: ${item.fixAvailable ? 'yes' : 'no'}`).join('\n') || 'No high or critical dependency advisories.';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${findings.length}\nsummary<<EOF\n${summary}\nEOF\n`);
          NODE
      - name: Store dependency audit report
        if: steps.audit.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: daily-dependency-audit-report
          path: audit-report.json
          retention-days: 30
      - name: Open or update dependency advisory issue
        if: steps.audit.outputs.count != '0'
        uses: actions/github-script@v7
        env:
          AUDIT_SUMMARY: ${{ steps.audit.outputs.summary }}
        with:
          script: |
            try {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'dependency-audit', color: 'd93f0b', description: 'Dependency advisories found by scheduled npm audit' });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependency-audit',
              per_page: 100
            });
            const title = 'High severity dependency advisory';
            const body = `Daily npm audit found high or critical advisories.\n\n\`\`\`\n${process.env.AUDIT_SUMMARY}\n\`\`\`\n\nReview the workflow run and available fixes. Some development-tool advisories may not have an upstream fix yet.`;
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['dependency-audit'] });
            }
      - name: Close resolved dependency advisory issue
        if: steps.audit.outputs.count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'dependency-audit', per_page: 100 });
            for (const issue of issues.filter((item) => item.title === 'High severity dependency advisory')) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
      - name: Report daily build failure
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily production build failed';
            const body = `The scheduled production build failed on ${context.sha}. Review the workflow run for compiler and TypeScript errors.`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'daily-build-failure', per_page: 100 });
            if (!issues.some((issue) => issue.title === title)) {
              try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'daily-build-failure', color: 'b60205' }); } catch (error) { if (error.status !== 422) throw error; }
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['daily-build-failure'] });
            }
      - name: Close resolved daily build issue
        if: steps.build.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'daily-build-failure', per_page: 100 });
            for (const issue of issues.filter((item) => item.title === 'Daily production build failed')) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
