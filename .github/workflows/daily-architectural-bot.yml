name: Daily dependency vulnerability check

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Query npm advisory database
        id: audit
        shell: bash
        run: |
          result=0
          npm audit --omit=dev --audit-level=high > audit-report.txt 2>&1 || result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          cat audit-report.txt
      - name: Open or update vulnerability issue
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'dependency-audit', color: 'd93f0b', description: 'Production dependency advisories found by scheduled npm audit' });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependency-audit',
              per_page: 100
            });
            const title = 'High severity production dependency advisory';
            const body = 'Daily `npm audit --omit=dev --audit-level=high` found production dependency advisories. Review this workflow run for npm’s report, then update affected packages.';
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['dependency-audit'] });
            }
