<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">GitBlast — repository intelligence</title>
  <desc id="desc">A dark technical banner with a glowing code dependency graph and change impact paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D18"/>
      <stop offset=".58" stop-color="#0B1424"/>
      <stop offset="1" stop-color="#111027"/>
    </linearGradient>
    <linearGradient id="title" x1="100" y1="180" x2="690" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FBFF"/>
      <stop offset=".58" stop-color="#DCE8FF"/>
      <stop offset="1" stop-color="#74E6DD"/>
    </linearGradient>
    <linearGradient id="accent" x1="100" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27D3C2"/>
      <stop offset=".5" stop-color="#638BFF"/>
      <stop offset="1" stop-color="#A875FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="790" y1="72" x2="1360" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121E32"/>
      <stop offset="1" stop-color="#101226"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(250 0 0 220 1132 264)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B5FEA" stop-opacity=".21"/>
      <stop offset="1" stop-color="#4B5FEA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#8CA6D8" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="560" rx="28" fill="url(#grid)"/>
  <path d="M0 1H1440" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="1132" cy="264" r="300" fill="url(#glow)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="88" y="82" width="352" height="34" rx="17" fill="#112A35" stroke="#27D3C2" stroke-opacity=".32"/>
    <circle cx="108" cy="99" r="4" fill="#27D3C2"/>
    <text x="122" y="104" fill="#8DEBE1" font-size="12" font-weight="700" letter-spacing="2.1">REPOSITORY INTELLIGENCE · IMPACT ANALYSIS</text>

    <text x="84" y="228" fill="url(#title)" font-size="94" font-weight="800" letter-spacing="-5">GitBlast</text>
    <path d="M92 250H620" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <text x="92" y="300" fill="#EAF0FC" font-size="26" font-weight="650">See how code connects.</text>
    <text x="92" y="337" fill="#9EABC3" font-size="19">Trace change impact before it reaches production.</text>

    <g font-size="13" font-weight="650" letter-spacing=".6">
      <rect x="92" y="385" width="156" height="38" rx="19" fill="#121E31" stroke="#27D3C2" stroke-opacity=".4"/>
      <circle cx="112" cy="404" r="4" fill="#27D3C2"/><text x="125" y="409" fill="#C7D4E9">DEPENDENCY MAP</text>
      <rect x="260" y="385" width="150" height="38" rx="19" fill="#121E31" stroke="#7F76FF" stroke-opacity=".42"/>
      <circle cx="280" cy="404" r="4" fill="#8B83FF"/><text x="293" y="409" fill="#C7D4E9">BLAST RADIUS</text>
      <rect x="422" y="385" width="154" height="38" rx="19" fill="#121E31" stroke="#A875FF" stroke-opacity=".42"/>
      <circle cx="442" cy="404" r="4" fill="#B08AFF"/><text x="455" y="409" fill="#C7D4E9">CODE INSIGHTS</text>
    </g>
    <text x="92" y="486" fill="#65738C" font-size="12" letter-spacing="1.5">NEXT.JS  ·  TYPESCRIPT  ·  WEB WORKERS  ·  GRAPH ANALYSIS</text>
  </g>

  <g>
    <rect x="730" y="66" width="630" height="428" rx="22" fill="url(#panel)" stroke="#8296BA" stroke-opacity=".2"/>
    <path d="M730 124H1360" stroke="#8296BA" stroke-opacity=".16"/>
    <circle cx="762" cy="96" r="5" fill="#FF6D7D"/>
    <circle cx="781" cy="96" r="5" fill="#FFC56B"/>
    <circle cx="800" cy="96" r="5" fill="#27D3C2"/>
    <text x="828" y="101" fill="#8492AB" font-family="Consolas, monospace" font-size="12" letter-spacing="1.3">CHANGE IMPACT MAP</text>
    <rect x="1210" y="83" width="116" height="25" rx="12.5" fill="#351E32" stroke="#FB7185" stroke-opacity=".45"/>
    <circle cx="1225" cy="95.5" r="3.5" fill="#FB7185"/>
    <text x="1236" y="100" fill="#FDA4AF" font-family="Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">CHANGED FILE</text>

    <g stroke-linecap="round" stroke-width="2">
      <path d="M900 235L1050 190L1194 228L1255 340L1115 390L1000 340L900 235Z" stroke="#64748B" stroke-opacity=".52"/>
      <path d="M900 235L1000 340L1115 390" stroke="#27D3C2" stroke-opacity=".78"/>
      <path d="M900 235L1050 190L1194 228" stroke="#FB7185" stroke-opacity=".85" filter="url(#soft)"/>
      <path d="M1000 340L1115 390L1255 340L1194 228" stroke="#8B83FF" stroke-opacity=".76"/>
      <path d="M1050 190L1115 390" stroke="#64748B" stroke-opacity=".4" stroke-dasharray="5 8"/>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#B9C6DB">
      <text x="856" y="215">src/app.ts</text>
      <text x="1017" y="164">auth.ts</text>
      <text x="1170" y="207">routes.ts</text>
      <text x="1230" y="365">tests.ts</text>
      <text x="1090" y="421">users.ts</text>
      <text x="950" y="366">config.ts</text>
    </g>
    <g filter="url(#soft)">
      <circle cx="900" cy="235" r="12" fill="#FB7185"/><circle cx="900" cy="235" r="5" fill="#FFF1F2"/>
      <circle cx="1050" cy="190" r="10" fill="#A875FF"/><circle cx="1050" cy="190" r="4" fill="#F3E8FF"/>
      <circle cx="1194" cy="228" r="10" fill="#7C83FF"/><circle cx="1194" cy="228" r="4" fill="#EEF2FF"/>
      <circle cx="1255" cy="340" r="9" fill="#7C83FF"/><circle cx="1255" cy="340" r="3.5" fill="#EEF2FF"/>
      <circle cx="1115" cy="390" r="9" fill="#27D3C2"/><circle cx="1115" cy="390" r="3.5" fill="#ECFEFF"/>
      <circle cx="1000" cy="340" r="9" fill="#27D3C2"/><circle cx="1000" cy="340" r="3.5" fill="#ECFEFF"/>
    </g>
    <path d="M762 451H1328" stroke="#8296BA" stroke-opacity=".15"/>
    <text x="764" y="473" fill="#71819B" font-family="Consolas, monospace" font-size="11" letter-spacing=".7">DIRECT DEPENDENCY</text>
    <path d="M897 469H925" stroke="#27D3C2" stroke-width="2.5" stroke-linecap="round"/>
    <text x="944" y="473" fill="#71819B" font-family="Consolas, monospace" font-size="11" letter-spacing=".7">DOWNSTREAM IMPACT</text>
    <path d="M1096 469H1124" stroke="#8B83FF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
